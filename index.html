<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Controle de Metas</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #0033cc;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      max-width: 1400px;
      margin: auto;
      padding: 50px 60px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
    }

    h2 {
      margin: 0;
      font-size: 32px;
      color: #0033cc;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      align-items: center;
    }

    input {
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      width: 100%;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #0033cc;
      box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1);
    }

    button {
      padding: 12px 24px;
      background: #0033cc;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.85;
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 51, 204, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }

    .stat-card {
      background: #f8f9fa;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 51, 204, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0, 51, 204, 0.15);
    }

    .stat-card-icon {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
    }

    .stat-card p {
      font-size: 13px;
      margin: 0 0 8px 0;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    .stat-card strong {
      font-size: 32px;
      display: block;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-card.total {
      background: #0033cc;
      color: white;
      box-shadow: 0 4px 12px rgba(0, 51, 204, 0.15);
    }

    .stat-card.total:hover {
      box-shadow: 0 8px 24px rgba(0, 51, 204, 0.25);
    }

    .stat-card.meta {
      background: #ffd600;
      color: #000;
      box-shadow: 0 4px 12px rgba(255, 214, 0, 0.15);
    }

    .stat-card.meta:hover {
      box-shadow: 0 8px 24px rgba(255, 214, 0, 0.25);
    }

    .stat-card.faltam {
      background: #0033cc;
      color: white;
      box-shadow: 0 4px 12px rgba(0, 51, 204, 0.15);
    }

    .stat-card.faltam:hover {
      box-shadow: 0 8px 24px rgba(0, 51, 204, 0.25);
    }

    .bar-container {
      background: #e8e8e8;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
      margin-bottom: 30px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .bar {
      height: 100%;
      background: #0033cc;
      border-radius: 12px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      position: relative;
      min-width: 50px;
    }

    .bar::after {
      content: attr(data-percentage);
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    table {
      width: 100%;
      margin-top: 40px;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #0033cc;
      color: white;
    }

    th {
      padding: 16px;
      text-align: center;
      font-weight: 600;
    }

    td {
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    tbody tr:hover {
      background: #f0f5ff;
      transition: background 0.2s ease;
    }

    .mes-titulo {
      background: #0033cc;
      color: white;
      padding: 14px 16px;
      font-weight: 700;
      text-align: left;
      font-size: 16px;
    }

    .btn-delete {
      background: #ffd600;
      padding: 8px 12px;
      font-size: 12px;
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      opacity: 0.85;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255, 214, 0, 0.3);
    }

    canvas {
      max-width: 100%;
      display: block !important;
    }

    canvas {
      margin-top: 30px;
      padding: 20px 0;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #0033cc;
      margin-top: 40px;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .progresso-container {
      margin-top: 40px;
      margin-bottom: 50px;
    }

    .progresso-texto {
      text-align: center;
      color: #666;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .progresso-valor {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #0033cc;
      margin-top: 8px;
    }

    .content-wrapper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-top: 40px;
    }

    .tabela-container {
      order: 2;
    }

    .grafico-container {
      order: 1;
      background: rgba(0, 51, 204, 0.03);
      padding: 35px;
      border-radius: 20px;
      height: auto;
      border: 1px solid rgba(0, 51, 204, 0.1);
      box-shadow: 0 4px 12px rgba(0, 51, 204, 0.08);
      margin-top: 0;
      margin-bottom: 30px;
    }

    .grafico-titulo {
      font-size: 18px;
      font-weight: 700;
      color: #0033cc;
      margin-bottom: 25px;
      text-align: left;
    }

    @media (max-width: 1200px) {
      .content-wrapper {
        grid-template-columns: 1fr;
      }

      .grafico-container {
        order: 2;
      }
    }

    @media (max-width: 768px) {
      .card {
        padding: 30px 20px;
        max-width: 100%;
      }

      h2 {
        font-size: 24px;
      }

      .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
        margin-bottom: 30px;
        padding-bottom: 20px;
      }

      .header button {
        width: 100%;
      }

      .input-group {
        flex-direction: column;
        gap: 10px;
      }

      .input-group button {
        width: 100%;
      }

      .stats-container {
        grid-template-columns: 1fr;
        gap: 15px;
        margin: 30px 0;
      }

      .stat-card {
        padding: 25px 20px;
        border-radius: 15px;
      }

      .stat-card strong {
        font-size: 28px;
      }

      .section-title {
        font-size: 18px;
        margin-top: 30px;
        margin-bottom: 15px;
      }

      .grafico-container {
        padding: 20px;
        margin-bottom: 20px;
      }

      .grafico-titulo {
        font-size: 16px;
        margin-bottom: 15px;
      }

      table {
        font-size: 12px;
        margin-top: 30px;
      }

      th, td {
        padding: 10px 8px;
      }

      .btn-delete {
        padding: 6px 10px;
        font-size: 11px;
      }

      .progresso-container {
        margin-top: 30px;
        margin-bottom: 30px;
      }

      .bar-container {
        height: 20px;
        margin-bottom: 20px;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 15px;
      }

      h2 {
        font-size: 20px;
      }

      .section-title {
        font-size: 16px;
        margin-top: 25px;
      }

      .stats-container {
        gap: 12px;
      }

      .stat-card {
        padding: 20px 15px;
      }

      .stat-card-icon {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .stat-card p {
        font-size: 12px;
      }

      .stat-card strong {
        font-size: 24px;
      }

      input {
        padding: 10px 12px;
        font-size: 13px;
      }

      button {
        padding: 10px 16px;
        font-size: 13px;
      }

      table {
        font-size: 11px;
      }

      th, td {
        padding: 8px 6px;
      }

      .grafico-container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="header">
      <h2>CONTROLE DE METAS</h2>
      <button onclick="resetar()" style="background: #0a0a0a;">🗑️ Limpar Dados</button>
    </div>

    <div class="section-title">📥 Adicionar Venda</div>
    <div class="input-group">
      <input type="date" id="data">
      <input type="number" id="valor" placeholder="Valor do dia">
      <button onclick="adicionar()">Adicionar</button>
    </div>

    <div class="section-title">⚙️ Configurações</div>
    <div class="input-group">
      <input type="number" id="meta" placeholder="Meta mensal" value="180000">
      <button onclick="atualizar()">Atualizar Meta</button>
    </div>

    <div class="input-group">
      <input type="date" id="dataLimpeza" placeholder="Selecione o mês para limpar">
      <button onclick="limparMes()" style="background: #ffd600; color: #000;">Limpar Mês</button>
    </div>

    <div class="section-title">📊 Resumo Mensal</div>
    <div class="stats-container">
      <div class="stat-card total">
        <span class="stat-card-icon">💰</span>
        <p>Total do Mês</p>
        <strong id="total">R$ 0,00</strong>
      </div>
      <div class="stat-card meta">
        <span class="stat-card-icon">🎯</span>
        <p>Meta</p>
        <strong id="metaValor">R$ 0,00</strong>
      </div>
      <div class="stat-card faltam">
        <span class="stat-card-icon">📈</span>
        <p>Faltam</p>
        <strong id="faltam">R$ 0,00</strong>
      </div>
    </div>

    <div class="progresso-container">
      <p class="progresso-texto">Progresso</p>
      <div class="bar-container">
        <div class="bar" id="progresso" style="width: 0%;"></div>
      </div>
    </div>

    <div class="content-wrapper">
      <div class="grafico-container">
        <p class="grafico-titulo">📈 Vendas do Mês</p>
        <canvas id="grafico" height="150"></canvas>
      </div>
    </div>

    <div class="section-title">📋 Registros de Vendas</div>
    
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Valor</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>

  </div>

  <script>

    let vendas = JSON.parse(localStorage.getItem("vendas")) || [];
    let metaMensal = Number(localStorage.getItem("meta")) || 180000;

    const tabela = document.getElementById("tabela");
    const totalEl = document.getElementById("total");
    const metaValorEl = document.getElementById("metaValor");
    const faltamEl = document.getElementById("faltam");
    const progressoEl = document.getElementById("progresso");
    document.getElementById("meta").value = metaMensal;

    let metaAtingida = false;

    function salvar() {
      localStorage.setItem("vendas", JSON.stringify(vendas));
      localStorage.setItem("meta", metaMensal);
    }

    function dispararConfete() {
      if (typeof confetti !== 'undefined') {
        confetti({
          particleCount: 200,
          spread: 80,
          origin: { y: 0.6 },
          duration: 2000
        });

        // Segundo efeito após 200ms
        setTimeout(() => {
          confetti({
            particleCount: 150,
            spread: 70,
            origin: { x: 0.2, y: 0.6 }
          });
          confetti({
            particleCount: 150,
            spread: 70,
            origin: { x: 0.8, y: 0.6 }
          });
        }, 200);
      }
    }

    function adicionar() {
      const data = document.getElementById("data").value;
      const valor = Number(document.getElementById("valor").value);

      if (!data || !valor) {
        alert("Preencha data e valor!");
        return;
      }

      vendas.push({ data, valor });
      salvar();
      render();
    }

    function atualizar() {
      metaMensal = Number(document.getElementById("meta").value);
      salvar();
      render();
    }

    function render() {

      tabela.innerHTML = "";
      let labels = [];
      let valores = [];

      let total = 0;

      // Agrupar vendas por mês
      let vendasPorMes = {};

      vendas.forEach((item, index) => {
        const dataParts = item.data.split("-");
        const mes = `${dataParts[0]}-${dataParts[1]}`; // YYYY-MM

        if (!vendasPorMes[mes]) {
          vendasPorMes[mes] = [];
        }

        vendasPorMes[mes].push({ ...item, index });
      });

      // Renderizar agrupado por mês
      Object.keys(vendasPorMes)
        .sort()
        .reverse()
        .forEach(mes => {
          const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
          const [ano, mesCod] = mes.split("-");
          const mesNome = meses[parseInt(mesCod) - 1];

          tabela.innerHTML += `
            <tr>
              <td colspan="3" class="mes-titulo">${mesNome} / ${ano}</td>
            </tr>
          `;

          vendasPorMes[mes].forEach((item, posicao) => {
            labels.push(item.data);
            valores.push(item.valor);
            total += item.valor;

            tabela.innerHTML += `
              <tr>
                <td>${item.data}</td>
                <td>R$ ${item.valor.toLocaleString()}</td>
                <td><button class="btn-delete" onclick="excluir(${item.index})">Excluir</button></td>
              </tr>
            `;
          });
        });

      totalEl.innerText = "R$ " + total.toLocaleString();
      metaValorEl.innerText = "R$ " + metaMensal.toLocaleString();
      faltamEl.innerText = "R$ " + (metaMensal - total).toLocaleString();

      let progresso = (total / metaMensal) * 100;
      let progressoArredondado = Math.round(progresso);
      progressoEl.style.width = progresso + "%";
      progressoEl.setAttribute("data-percentage", progressoArredondado + "%");

      // Verifica se atingiu a meta
      if (total >= metaMensal && !metaAtingida) {
        metaAtingida = true;
        dispararConfete();
      } else if (total < metaMensal) {
        metaAtingida = false;
      }

      grafico(labels, valores);
    }

    function excluir(index) {
      if (!confirm("Tem certeza que deseja excluir este item?")) return;
      vendas.splice(index, 1);
      salvar();
      render();
    }

    function limparMes() {
      const data = document.getElementById("dataLimpeza").value;
      
      if (!data) {
        alert("Selecione uma data para limpar o mês!");
        return;
      }

      const mesSelecionado = data.substring(0, 7); // YYYY-MM

      if (!confirm(`Tem certeza que deseja excluir todos os registros de ${mesSelecionado}?`)) return;

      vendas = vendas.filter(item => !item.data.startsWith(mesSelecionado));
      salvar();
      render();
      document.getElementById("dataLimpeza").value = "";
    }


    function resetar() {
      if (!confirm("Tem certeza que deseja apagar tudo?")) return;
      vendas = [];
      salvar();
      render();
    }


    let chart;

    function grafico(labels, data) {

      const ctx = document.getElementById("grafico");

      if (chart) {
        chart.destroy();
      }

      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Vendas",
              data,
              borderWidth: 2,
              pointRadius: 4,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: true } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }


    render();
  </script>

</body>
</html>
